<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>CareAble — Caregiver Capability Recognition</title>
    <meta name="description" content="CareAble helps unpaid carers recognise and validate their caregiving skills. Take a free self-assessment, get a personalised capability report, and download a professional digital certificate." />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://careable.site" />
    <meta property="og:title" content="CareAble — Caregiver Capability Recognition" />
    <meta property="og:description" content="Turn your caregiving experience into recognised, professional capability. Free self-assessment aligned with the Australian Skills Classification." />
    <meta property="og:image" content="https://careable.site/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CareAble — Caregiver Capability Recognition" />
    <meta name="twitter:description" content="Turn your caregiving experience into recognised, professional capability." />
    <meta name="twitter:image" content="https://careable.site/og-image.png" />

    <!-- Theme colour -->
    <meta name="theme-color" content="#4f46e5" />

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo-img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin-bottom: 1rem;
        animation: loader-pulse 1.4s ease-in-out infinite;
        filter: brightness(0) invert(1);
      }

      .loader-brand {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.4rem;
      }

      .loader-tagline {
        font-size: 0.875rem;
        opacity: 0.8;
        margin-bottom: 2rem;
        text-align: center;
        max-width: 280px;
      }

      .loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: loader-spin 0.9s linear infinite;
      }

      @keyframes loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen — shows before React mounts -->
    <div id="initial-loader">
      <img src="/logo-icon.png" alt="CareAble" class="loader-logo-img" />
      <div class="loader-brand">CareAble</div>
      <div class="loader-tagline">Supporting hidden caregiving workers in Australia</div>
      <div class="loader-spinner" aria-label="Loading"></div>
    </div>

    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
